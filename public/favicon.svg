<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0914" />
      <stop offset="100%" stop-color="#1e1338" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5" />

  <!-- Inner Content with Glow -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 21 21 L 11 32 L 21 43" stroke="url(#codeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <path d="M 36 19 L 28 45" stroke="url(#slashGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 43 21 L 53 32 L 43 43" stroke="url(#codeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
